AWSTemplateFormatVersion: '2010-09-09'
Description: AliviaAPP - Frontend estatico (S3 + CloudFront) con /api/* en la Lambda

Parameters:
  # Dominio del sitio. Se deja vacio para desplegar solo con la URL de
  # CloudFront (d3gm2ziao5tkw0.cloudfront.net), que es el estado por defecto.
  DomainName:
    Type: String
    Default: ''
    Description: Dominio principal, sin https ni barra. Vacio = sin dominio.
  AliasHost:
    Type: String
    Default: ''
    Description: CNAME de www que redirige al dominio principal.
  DomainDelegated:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Poner en true solo cuando los nameservers ya apunten a Route53.
  SiteCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:283519660369:certificate/39ab505a-30cd-43b3-888c-62d65d08a036
    Description: ARN del certificado ACM (us-east-1) que cubre el dominio y www.

Conditions:
  # Solo se crea el certificado, los aliases y los registros DNS si hay dominio.
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  # www es opcional.
  HasAlias: !Not [!Equals [!Ref AliasHost, '']]
  # Los registros DNS del dominio solo se crean si la zona ya fue delegada a
  # Route53 desde el registrador. Delegar nameservers es manual, asi que este
  # flag se activa a mano cuando el dominio ya resuelve contra Route53.
  # Se exige HasDomain para que el lint no acepte HostedZone cuando el recurso
  # no se crea.
  DomainDelegated: !And
    - !Equals [!Ref DomainDelegated, 'true']
    - !Not [!Equals [!Ref DomainName, '']]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'alivia-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: alivia-frontend

  # Las politicas gestionadas de CloudFront bloquean los metodos en GET/HEAD
  # (Managed-CachingDisabled incluida), asi que POST/PUT/PATCH/DELETE reciben un
  # 403 y el custom error response devolvia index.html. Esta politica propia no
  # cachea nada y permite elegir los metodos en cada cache behavior.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: alivia-api-no-cache
        Comment: Sin cache efectiva para la API y el TTS
        # CloudFront no permite comprimir ni reenviar query strings cuando el
        # cache esta totalmente desactivado (TTL 0). Con DefaultTTL 0 y MaxTTL 1
        # no se cachea nada salvo que el origen lo pida, y sigue permitiendo
        # comprimir y reenviar query strings.
        DefaultTTL: 0
        MaxTTL: 1
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          # Authorization entra en la clave de cache para que, si algo se
          # cachease, jamas se comparta entre usuarios distintos.
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Authorization
          QueryStringsConfig:
            QueryStringBehavior: all
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  # Reenvía al origen la query string (TTS: ?text=...) y todas las cabeceras del
  # viewer, incluida Authorization. Sin esto la API no recibe el token.
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: alivia-api-forward-all
        Comment: Reenvia query string y cabeceras a la API
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          # allViewer reenviaria la cabecera Host del viewer (el dominio de
          # CloudFront) y la Lambda Function URL la rechaza con 403. Se reenvia
          # todo menos Host para que CloudFront ponga el host del origen.
          HeaderBehavior: allExcept
          Headers:
            - Host
        QueryStringsConfig:
          QueryStringBehavior: all

  # OAC firma las peticiones con sigv4, pero S3 sigue exigiendo que una bucket
  # policy autorice a esa distribucion. Sin ella CloudFront recibe 403.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
                  - DistributionId: !Ref Distribution

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: alivia-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AliviaAPP web + api
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        # El dominio propio se sirve con el mismo certificado y la misma
        # distribucion que la URL de CloudFront: no hay una distribucion aparte.
        Aliases:
          - !If [HasDomain, !Ref DomainName, !Ref 'AWS::NoValue']
          - !If [HasAlias, !Ref AliasHost, !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref SiteCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        Origins:
          # Sitios estaticos en S3
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # API en Lambda Function URL. El export es
          # https://<id>.lambda-url.us-east-1.on.aws/ -> al partir por "/" el
          # dominio es el indice 2. No se define OriginPath (quedaria vacio y
          # CloudFront no lo admite); la ruta /api/* la anade la cache behavior.
          - Id: ApiOrigin
            DomainName: !Select [2, !Split ['/', !ImportValue alivia-function-url]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              HTTPPort: 80
              HTTPSPort: 443
          # TTS en su propia Lambda, FUERA del VPC (necesita salida a internet).
          - Id: TtsOrigin
            DomainName: !Select [2, !Split ['/', !ImportValue alivia-tts-url]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              HTTPPort: 80
              HTTPSPort: 443
          # IA (Groq) tambien FUERA del VPC, igual que el TTS.
          - Id: AiOrigin
            DomainName: !Select [2, !Split ['/', !ImportValue alivia-ai-url]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaFallback.FunctionMetadata.FunctionARN
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          # /api/ai/* va a la Lambda de IA (Groq), sin cache.
          # Compress va desactivado a proposito: comprimir obliga a CloudFront a
          # hacer buffering del origen, y el streaming de tokens se queda
          # atrapado en un buffer hasta que llega el final de la respuesta.
          - PathPattern: /api/ai/*
            TargetOriginId: AiOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: false
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
          # /api/tts va a la Lambda de voz, sin cache
          - PathPattern: /api/tts
            TargetOriginId: TtsOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
          # /api/* va siempre a la Lambda, sin cache
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # Los SPA necesitan que /cualquier/ruta sirva index.html, pero los errores de
  # /api/* deben llegar al cliente sin transformar. Esta CloudFront Function
  # reescribe a index.html solo en el origen estatico cuando la ruta no tiene
  # extension y no es /api/*, de modo que los custom error responses solo se
  # activan por assets realmente inexistentes.
  SpaFallback:
    Type: AWS::CloudFront::Function
    Properties:
      Name: alivia-spa-fallback
      AutoPublish: true
      FunctionConfig:
        Comment: SPA fallback to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          if (uri.indexOf('/api/') === 0) return event.request;
          if (uri.indexOf('.') !== -1) return event.request;
          event.request.uri = '/index.html';
          return event.request;
        }

  # ---------------------------------------------------------------------------
  # Dominio propio: alivia.lat
  #
  # El certificado va en us-east-1 porque es la unica region donde CloudFront
  # acepta ACM, aunque el resto de la app viva en otra. La zona de Route53 se
  # creo a mano (Z08836062K7BJNET4K1AC) y el certificado tambien, porque ACM no
  # se puede crear desde la plantilla sin conocer antes el certificado que
  # valida el dominio: seria un ciclo.
  # ---------------------------------------------------------------------------

# El certificado y la hosted zone se crearon a mano y se importan por id.
  # ACM no puede validarse con un registro DNS que crea la propia plantilla que
  # lo referencia (seria un ciclo), y la zona tiene que existir antes de delegar
  # los nameservers en el registrador.
  #

  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: HasDomain
    Properties:
      Name: !Sub '${DomainName}.'
      HostedZoneConfig:
        Comment: Zona de alivia.lat gestionada por CloudFormation

  # La hosted zone y el certificado se crearon a mano (la zona antes de delegar
  # los nameservers, el certificado porque ACM necesita un registro DNS que la
  # propia plantilla crearia: seria un ciclo). Se referencian por id.
  #
  # No hace falta una distribucion auxiliar para que CloudFront valide el
  # dominio: lo comprueba solo cuando el DNS ya resuelve contra esta cuenta, que
  # es justo lo que paso tras delegar los nameservers en el registrador. Con la
  # auxiliar, CloudFront rechazaba el despliegue con "One or more of the CNAMEs
  # you provided are already associated with a different resource".
  #
  # Los registros se crean solo si la zona ya fue delegada a Route53.
  ApexAlias:
    Type: AWS::Route53::RecordSet
    Condition: DomainDelegated
    Properties:
      HostedZoneId: Z08836062K7BJNET4K1AC
      Name: !Sub '${DomainName}.'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwAlias:
    Type: AWS::Route53::RecordSet
    Condition: DomainDelegated
    Properties:
      HostedZoneId: Z08836062K7BJNET4K1AC
      Name: !Sub '${AliasHost}.'
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Sub '${DomainName}.'

  # Alojamiento alterno de CloudFront (hosted zone Z2FDTNDATAQYW2, de AWS).
  # No es un recurso nuestro: se referencia por id en ApexAlias.

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  DomainName:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !GetAtt Distribution.DomainName]
  CertificateArn:
    Condition: HasDomain
    Value: !Ref SiteCertificateArn
  Route53ZoneId:
    Condition: HasDomain
    Value: Z08836062K7BJNET4K1AC

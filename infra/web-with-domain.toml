# AliviaAPP - parametros del stack web con el dominio propio (infra/web.yaml)
#
# Solo usar cuando alivia.lat ya resuelva contra Route53. Si los nameservers
# siguen en SpaceShip, CloudFormation falla al validar el certificado o al
# asociar el alias, y se pierde tiempo. Nameservers de Route53:
#
#   ns-1851.awsdns-39.co.uk
#   ns-1270.awsdns-30.org
#   ns-216.awsdns-27.com
#   ns-918.awsdns-50.net
#
# Comprobacion previa:
#   nslookup -type=NS alivia.lat
#
# Uso (SAM exige ruta absoluta en --config-file):
#   sam deploy --template-file infra/web.yaml --stack-name alivia-web \
#     --region us-east-1 --config-file "<repo>/infra/web-with-domain.toml"
version = 0.1
[default.global.parameters]
DomainName = "alivia.lat"
AliasHost = "www.alivia.lat"
DomainDelegated = "true"
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AliviaAPP - Lambda API + Function URL

Parameters:
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Must match the password used to create alivia-db
  GitHubOwner:
    Type: String
    Default: imandro
  GitHubRepo:
    Type: String
    Default: AliviaAPP

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 30
    MemorySize: 256

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: alivia-api
      CodeUri: ../api/lambda/dist/
      Handler: handler.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DATABASE_URL: !Join
            - ''
            - - 'postgresql://alivia_admin:'
              - !Ref DatabasePassword
              - '@'
              - Fn::ImportValue: alivia-db-endpoint
              - ':5432/alivia'
          NODE_ENV: production
          # El dispatch de notificaciones lo invoca EventBridge Scheduler con
          # "Authorization: Bearer <CRON_SECRET>". Las claves VAPID salen del
          # mismo secret; se generaron con crypto (P-256, publicKey=87 chars y
          # privateKey=43) y hay que subirlas con:
          #   aws secretsmanager put-secret-value --secret-id alivia/notification-secret \
          #     --secret-string file://vapid.json
          # Ojo: pasando el JSON en la linea de comandos, el shell se come las
          # comillas y CloudFormation falla con "Could not parse SecretString
          # JSON". Siempre por archivo.
          #
          # CloudFormation solo resuelve {{resolve:}} cuando el recurso cambia,
          # asi que rellenar el secret NO refresca la Lambda por si solo: hay que
          # desplegar con algun cambio real en este archivo.
          CRON_SECRET: !Sub '{{resolve:secretsmanager:alivia/notification-secret:SecretString:CRON_SECRET}}'
          VAPID_PUBLIC_KEY: '{{resolve:secretsmanager:alivia/notification-secret:SecretString:VAPID_PUBLIC_KEY}}'
          VAPID_PRIVATE_KEY: '{{resolve:secretsmanager:alivia/notification-secret:SecretString:VAPID_PRIVATE_KEY}}'
          VAPID_SUBJECT: '{{resolve:secretsmanager:alivia/notification-secret:SecretString:VAPID_SUBJECT}}'
      VpcConfig:
        SecurityGroupIds:
          - !Ref ApiSecurityGroup
        SubnetIds:
          - Fn::ImportValue: alivia-subnet1
          - Fn::ImportValue: alivia-subnet2
      Policies:
        - AWSLambdaVPCAccessExecutionRole
      FunctionUrlConfig:
        AuthType: NONE

  # El SG de la Lambda vive aqui, y no en alivia-net, para no exportar un SG a
  # otro stack. CloudFormation rechaza cualquier actualizacion de alivia-net que
  # toque un recurso con un export consumido ("Cannot update export
  # alivia-lambda-sg as it is in use by alivia-app"), lo que dejaba alivia-net
  # atascado en UPDATE_ROLLBACK_COMPLETE.
  # Solo se permite salida a PostgreSQL (5432) dentro del VPC: la Lambda no tiene
  # IP publica ni ruta a IGW, y el TTS se ejecuta en alivia-tts, fuera del VPC.
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the API Lambda function
      VpcId:
        Fn::ImportValue: alivia-vpc-id
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: alivia-lambda-sg

  # El TTS necesita salir a internet (Bing Edge TTS / Google Translate) para
  # sintetizar voz. Una Lambda dentro del VPC no tiene salida a internet y eso
  # exigiria un NAT Gateway (~$32/mes), asi que esta Lambda se queda FUERA del
  # VPC. No toca la base de datos, por lo que no necesita ruta privada.
  # El navegador movil llama directamente a esta Function URL.
  TtsFunction:
      Type: AWS::Serverless::Function
      Properties:
        FunctionName: alivia-tts
        CodeUri: ../api/lambda/dist-tts/
        Handler: handler.handler
        Timeout: 30
        MemorySize: 256
        Environment:
          Variables:
            NODE_ENV: production
            # ElevenLabs es el motor principal de la voz de VIA; si falta la clave
            # o falla, la Lambda cae a Edge TTS y luego a Google, para que VIA nunca
            # se quede muda. La clave va en Secrets Manager, no en el bundle.
            ELEVENLABS_API_KEY: '{{resolve:secretsmanager:alivia/elevenlabs-api-key:SecretString:ELEVENLABS_API_KEY}}'
            ELEVENLABS_VOICE_ID: 'EXAVITQu4vr4xnSDxMaL'
            ELEVENLABS_MODEL: 'eleven_multilingual_v2'
        FunctionUrlConfig:
          AuthType: NONE
      Policies:
        - PolicyName: ReadElevenLabsSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # Comillas obligatorias: sin ellas el ":*" final se lee como un
                # alias YAML y el template deja de parsear.
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:alivia/elevenlabs-api-key-*'

  # La IA tambien sale a internet, por el mismo motivo que el TTS: la Lambda de
  # datos esta en el VPC para llegar a RDS y desde ahi no hay salida. Aqui viven
  # las claves, de modo que ninguna entra en el bundle del navegador: el cliente
  # llama a /api/ai/* y esta Lambda reenvia.
  #
  # Proveedor hibrido, porque las economias no coinciden:
  #   - Chat a OpenAI (gpt-4.1-mini): responde bastante mejor en espanol.
  #   - Voz a Groq (Whisper v3 turbo): alli la transcripcion cuesta $0.04/hora,
  #     frente a ~$0.006/minuto en OpenAI. Llevarla a OpenAI la encarece ~9x.
  # Si OPENAI_API_KEY falta, el chat cae a Groq automaticamente.
  #
  # InvokeMode RESPONSE_STREAM es lo que permite ir mostrando los tokens segun
  # llegan en vez de esperar a la respuesta completa.
  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: alivia-ai
      CodeUri: ../api/lambda/dist-ai/
      Handler: handler.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          NODE_ENV: production
          # Gemini es el proveedor principal del chat. Va antes que OpenAI y
          # Groq en la cadena de respaldo porque responde mejor en espanol y
          # ya esta facturado. La clave vive en Secrets Manager.
          GEMINI_API_KEY: '{{resolve:secretsmanager:alivia/gemini-api-key:SecretString:GEMINI_API_KEY}}'
          # El endpoint compatible con OpenAI de Google devuelve 429 "high
          # demand" de forma intermitente en los Flash (probado con esta
          # cuenta), asi que se prueban en orden. gemini-3.1-pro-preview queda
          # fuera porque con esta clave responde "exceeded your current quota":
          # el plan no cubre el tier Pro.
          GEMINI_MODELS: 'gemini-3.6-flash,gemini-3.5-flash,gemini-flash-latest'
          GROQ_API_KEY: '{{resolve:secretsmanager:alivia/groq-api-key:SecretString:VITE_GROQ_API_KEY}}'
          OPENAI_API_KEY: '{{resolve:secretsmanager:alivia/openai-api-key:SecretString:VITE_OPENAI_API_KEY}}'
          OPENAI_MODELS: 'gpt-4.1-mini,gpt-4.1-nano,gpt-4o-mini'
          # Modelos que la cuenta de Groq tiene realmente. qwen/qwen3.8-27b va
          # primero porque responde mejor en espanol; los gpt-oss quedan de
          # respaldo. Los llama-3.x de Groq ya no existen en /v1/models.
          GROQ_MODELS: 'qwen/qwen3.8-27b,openai/gpt-oss-120b,openai/gpt-oss-20b'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      Policies:
        # Formato de politica inline de SAM: Version + Statement directamente.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:alivia/groq-api-key-*'
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:alivia/openai-api-key-*'
                - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:alivia/gemini-api-key-*'

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: alivia-github-actions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # El claim sub real de este repositorio incluye los IDs numericos:
              #   repo:Imandro@148641475/AliviaApp@1316806573:ref:refs/heads/main
              # No es el formato clasico OWNER/REPO, por eso no basta con
              # "repo:Imandro/AliviaApp:*". AWS compara el claim de forma
              # sensible a mayusculas, asi que se escribe tal cual lo emite GitHub.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOwner}@148641475/${GitHubRepo}@1316806573:*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/CloudFrontFullAccess

  # --- Cron de notificaciones (sustituye al cron de vercel.json) -------------
  # El dispatch se llama cada minuto por HTTP contra la Function URL de la API.
  # El secreto CRON_SECRET se genera aqui y se reutiliza tanto en la Connection
  # como en las variables de la Lambda, asi que no queda expuesto en el repo.
  NotificationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: alivia/notification-secret
      Description: CRON_SECRET para invocar /api/notifications/dispatch
      GenerateSecretString:
        # CRON_SECRET se genera; las claves VAPID se dejan vacias y se rellenan a
        # mano con las del navegador. Existen como claves (aunque vacias) para
        # que las referencias dinamicas de la Lambda no fallen.
        SecretStringTemplate: '{"CRON_SECRET":"GENERATE","VAPID_PUBLIC_KEY":"","VAPID_PRIVATE_KEY":"","VAPID_SUBJECT":""}'
        GenerateStringKey: CRON_SECRET
        PasswordLength: 40

  NotificationConnection:
    Type: AWS::Events::Connection
    Properties:
      Name: alivia-notifications
      Description: Invoca el dispatch de notificaciones con su secreto
      AuthorizationType: API_KEY
      # ApiKeyAuthParameters va anidado dentro de AuthParameters; al nivel superior
      # CloudFormation rechaza la plantilla con PropertyValidation.
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: Authorization
          # La Lambda espera "Bearer <secreto>", igual que recibia de Vercel Cron.
          ApiKeyValue: 'Bearer {{resolve:secretsmanager:alivia/notification-secret:SecretString:CRON_SECRET}}'

  NotificationApiDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      Name: alivia-notifications-dispatch
      ConnectionArn: !GetAtt NotificationConnection.Arn
      # Dominio de la Function URL: https://<id>.lambda-url.us-east-1.on.aws/
      InvocationEndpoint: !Sub
        - 'https://${Host}/api/notifications/dispatch'
        - Host: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
      HttpMethod: POST
      InvocationRateLimitPerSecond: 1

  # AWS::Scheduler::Schedule NO admite un intrinsic (Fn::GetAtt/Fn::Sub) en
  # Target.RoleArn: su patron lo valida antes de resolverlo y el changeset falla
  # con PropertyValidation. Por eso el cron usa AWS::Events::Rule, que si lo
  # acepta. Misma frecuencia que el cron de Vercel.
  NotificationSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeNotificationsApiDestination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !GetAtt NotificationApiDestination.Arn

  NotificationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: alivia-notification-dispatch
      Description: Cada minuto, como hacia el cron de Vercel
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: dispatch
          Arn: !GetAtt NotificationApiDestination.Arn
          RoleArn: !GetAtt NotificationSchedulerRole.Arn

Outputs:
  LambdaFunctionUrl:
    # AWS::Lambda::Url devuelve el ARN con !Ref; la URL se obtiene con Fn::GetAtt.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
    Export:
      Name: alivia-function-url
  TtsFunctionUrl:
    Value: !GetAtt TtsFunctionUrl.FunctionUrl
    Export:
      Name: alivia-tts-url
  AiFunctionUrl:
    Value: !GetAtt AiFunctionUrl.FunctionUrl
    Export:
      Name: alivia-ai-url
  LambdaFunctionArn:
    Value: !GetAtt ApiFunction.Arn
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn

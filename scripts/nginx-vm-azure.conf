server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 57.156.61.193;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://57.156.61.193$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 57.156.61.193;
    ssl_certificate /etc/letsencrypt/live/alivia-azure-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alivia-azure-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/alivia-azure/current/dist;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location = /readyz { proxy_pass http://127.0.0.1:8080; }
    location = /healthz { proxy_pass http://127.0.0.1:8080; }
    location = /sw.js { add_header Cache-Control "no-cache" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}

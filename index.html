<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-128.png" sizes="128x128" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="ALIVIA" />
    <!-- Viewport bloqueado para PWA: sin zoom por pellizco ni doble toque -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Meta tags SEO y Web App -->
    <title>ALIVIA - Tu Espacio de Calma</title>
    <meta name="description" content="ALIVIA es un espacio seguro y ultra-minimalista para adolescentes y jóvenes. Encuentra calma, realiza ejercicios de respiración, escribe tus pensamientos para dejarlos ir y accede a apoyo inmediato en crisis." />
    <meta name="theme-color" content="#2C533D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Fuentes auto-hospedadas (Lato + Quicksand) vía src/fonts.css: paridad offline en web y app nativa -->

    <!-- Fondo inmediato; el estilo de carga se resuelve antes de mostrar el HTML. -->
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #1a2a20; overflow: hidden; }
    </style>
    <link rel="preload" as="image" href="/src/assets/logo-vertical.png" />
    <link rel="stylesheet" href="/src/components/LoadingBrand.css" />
  </head>
  <body>
    <!-- Una sola capa permanece hasta que la primera pantalla esté pintada. -->
    <div id="app-preloader">
      <div class="loading-brand" role="status" aria-label="Cargando ALIVIA">
        <div class="loading-brand-emblem" aria-hidden="true">
          <img src="/src/assets/logo-vertical.png" alt="" width="96" height="128" fetchpriority="high" />
        </div>
        <span class="loading-brand-name" aria-hidden="true">alivia</span>
        <span class="loading-brand-tagline" aria-hidden="true">Un momento para ti.</span>
        <span class="loading-brand-pulse" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="loading-brand-label">Preparando tu espacio seguro…</span>
      </div>
      <div id="startup-recovery" class="startup-recovery" hidden>
        Está tomando más tiempo de lo habitual.
        <button id="startup-retry" type="button">Volver a intentar</button>
      </div>
      <noscript>Activa JavaScript para abrir ALIVIA.</noscript>
    </div>

    <div id="root" inert></div>
    <script src="%BASE_URL%startup.js"></script>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Bloquear zoom por pellizco y doble toque en toda la app (PWA)
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });
      document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    </script>
  </body>
</html>

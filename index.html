    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="ALIVIA" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Meta tags SEO y Web App -->
    <title>ALIVIA - Tu Espacio de Calma</title>
    <meta name="description" content="ALIVIA es un espacio seguro y ultra-minimalista para adolescentes y jóvenes. Encuentra calma, realiza ejercicios de respiración, escribe tus pensamientos para dejarlos ir y accede a apoyo inmediato en crisis." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Verificacion de Google Search Console. Va en el head de la raiz: es
         lo que Google descarga para confirmar que alivia.lat es tuyo. -->
    <meta name="google-site-verification" content="X7CJ_RKRPrpAP2DtYNzhUA3fNdIbILOIgXFiwHscnAI" />

    <!-- Canonical. Sin esto, / y /landing.html y la URL de CloudFront compiten
         como tres paginas distintas del mismo sitio. -->
    <link rel="canonical" href="https://alivia.lat/" />

<!-- La SPA exige login para casi todo: sin esto Google podria indexar paginas
         privadas que solo muestran la pantalla de acceso. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph: sin esto, al compartir el enlace en WhatsApp, Instagram o X
         sale solo el enlace, sin titulo ni imagen. -->

    <meta property="og:site_name" content="ALIVIA" />
    <meta property="og:locale" content="es" />
    <meta property="og:title" content="ALIVIA - Tu Espacio de Calma" />
    <meta property="og:description" content="Respiración guiada, diario que se disuelve y apoyo inmediato en crisis. Un refugio para adolescentes y jóvenes." />
    <meta property="og:url" content="https://alivia.lat/" />
    <meta property="og:image" content="https://alivia.lat/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="ALIVIA, tu espacio de calma" />

    <!-- Twitter/X usa sus propias etiquetas cuando existen, y og:* como respaldo -->

    <meta name="twitter:title" content="ALIVIA - Tu Espacio de Calma" />
    <meta name="twitter:description" content="Respiración guiada, diario que se disuelve y apoyo inmediato en crisis." />
    <meta name="twitter:image" content="https://alivia.lat/icon-512.png" />

         web y con acciones como "instalar". -->

      "applicationCategory": "HealthApplication",
      "operatingSystem": "any",

      "image": "https://alivia.lat/icon-512.png",
      "sameAs": ["https://www.alivia.lat/"]
    }
    </script>
    
    <!-- Fuentes auto-hospedadas (Lato + Quicksand) vía src/fonts.css: paridad offline en web y app nativa -->

    <!-- Fondo inmediato; el estilo de carga se resuelve antes de mostrar el HTML. -->
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #102a22; overflow: hidden; }
    </style>
    <style id="loading-critical">
/* Apertura de marca: trazado, relleno y firma. También se carga antes de React. */
#app-preloader, .loading-screen {
  --brand-ivory: #eee9d9;
  --brand-gold: #e2ca7e;
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  min-height: 100%;
  overflow: hidden;
  color: var(--brand-ivory);
  background: #102a22;
  isolation: isolate;
}

#app-preloader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  box-sizing: border-box;
  transition: opacity 650ms cubic-bezier(.4, 0, .2, 1);
}
#app-preloader.is-leaving { opacity: 0; }
.loading-screen { padding: 24px; box-sizing: border-box; }

.brand-atmosphere { position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
.brand-atmosphere::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 48% 44%, #386447 0%, #1c3e30 25%, #0b211b 62%, #071813 100%);

}
.brand-atmosphere::after {
  content: ''; position: absolute; width: min(110vw, 1100px); height: 180%; left: -35%; top: -60%;
  border-radius: 50%; border: 1px solid rgba(222, 218, 183, .055);
  box-shadow: 0 0 0 65px rgba(222, 218, 183, .018), 0 0 0 130px rgba(222, 218, 183, .012);
  transform: rotate(-32deg); 
}

.loading-brand {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 360px;
  text-align: center;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-weight: 300;
  transform: translateY(-10px);
}
.brand-symbol { width: 116px; height: 155px; overflow: hidden; display: block; }
.brand-draw {
  fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: brand-trace 1500ms cubic-bezier(.4, 0, .2, 1) 80ms both;
}
.brand-draw-wing { animation-delay: 300ms; animation-duration: 1400ms; }
.brand-draw-ribbon { stroke: #fff; animation-delay: 650ms; animation-duration: 1100ms; }
.brand-fill { animation: brand-ink 1100ms cubic-bezier(.4, 0, .2, 1) 600ms both; }
.brand-symbol { animation: brand-settle 1900ms cubic-bezier(.22, 1, .36, 1) both; }
.brand-signature {
  display: block; width: 174px; height: 77px; margin-top: 16px; overflow: visible;
  animation: brand-sign 1100ms cubic-bezier(.22, 1, .36, 1) 950ms both;
}
.brand-signature rect { fill: #fff; }
.brand-tagline { margin: 16px 0 0; color: #c7d0bd; font-size: 14px; letter-spacing: .1em; line-height: 1.5; animation: brand-tagline 950ms cubic-bezier(.22, 1, .36, 1) 1550ms both; }
.brand-wait {
  position: absolute; bottom: max(48px, calc(env(safe-area-inset-bottom) + 24px)); left: 24px; right: 24px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  animation: brand-tagline 900ms ease 1900ms both;
}
.brand-wait-track { position: relative; height: 1px; width: 88px; overflow: hidden; background: rgba(215, 223, 197, .12); }
.brand-wait-track::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #e2ca7e, transparent); animation: brand-wait 2200ms ease-in-out infinite; }
.brand-wait-label { color: #9eb3a3; font: 300 10px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .18em; text-transform: uppercase; }
.startup-recovery { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); left: 24px; right: 24px; text-align: center; font: 13px/1.6 'Lato', system-ui, sans-serif; color: #c7d0bd; }
.startup-recovery[hidden] { display: none; }
.startup-recovery button { display: block; margin: 10px auto 0; padding: 10px 22px; border: 1px solid #768d76; border-radius: 24px; color: #eee9d9; background: #244635; font: inherit; cursor: pointer; }
.startup-recovery button:focus-visible { outline: 2px solid #e2ca7e; outline-offset: 4px; }
#app-preloader.has-recovery .brand-wait { display: none; }

/* Las esperas internas muestran la firma ya construida: la presentación se hace una vez. */
.loading-screen .brand-symbol, .loading-screen .brand-fill, .loading-screen .brand-signature, .loading-screen .brand-tagline, .loading-screen .brand-wait { animation: none; }
.loading-screen .brand-draw { display: none; }

@keyframes brand-trace { 0% { stroke-dashoffset: 1; opacity: 0; } 12% { opacity: 1; } 70% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes brand-ink { from { opacity: 0; } to { opacity: 1; } }
@keyframes brand-settle { from { opacity: 0; transform: translateY(8px) scale(.97); } 25% { opacity: 1; } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes brand-sign { from { opacity: 0; transform: translateY(9px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes brand-tagline { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes brand-light-open { from { opacity: .35; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
@keyframes brand-contour { from { opacity: 0; transform: rotate(-35deg) translateX(-30px); } to { opacity: 1; transform: rotate(-32deg) translateX(0); } }
@keyframes brand-wait { 0% { transform: translateX(-100%); } 65%, 100% { transform: translateX(100%); } }

@media (max-width: 480px) {
  .brand-symbol { width: 106px; height: 142px; }
  .brand-signature { width: 158px; height: 70px; margin-top: 14px; }
  .brand-tagline { font-size: 12px; margin-top: 14px; }
  .brand-wait { bottom: max(44px, calc(env(safe-area-inset-bottom) + 24px)); }
}
@media (max-height: 540px) {
  .loading-brand { transform: translateY(-15px); }
  .brand-symbol { width: 72px; height: 96px; }
  .brand-signature { width: 116px; height: 51px; margin-top: 10px; }
  .brand-tagline { margin-top: 10px; font-size: 11px; }
  .brand-wait { bottom: 18px; gap: 10px; }
  #app-preloader.has-recovery .brand-tagline { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #app-preloader { transition: none; }
  .loading-brand *, .brand-wait, .brand-wait-track::after, .brand-atmosphere::before, .brand-atmosphere::after { animation: none !important; }
  .brand-draw { display: none; }
}


/* Solo pequeñas capas se animan. En móvil/ahorro de datos se omite el trazado SVG. */
.brand-symbol, .brand-signature { contain: layout paint; }
#app-preloader[data-lite] .brand-draw { display: none; }
#app-preloader[data-lite] .brand-fill { animation: none; }
#app-preloader[data-lite] .brand-symbol { animation: brand-settle 1400ms cubic-bezier(.22, 1, .36, 1) both; }
@media (max-width: 480px) {
  .brand-draw { display: none; }
  .brand-fill { animation: none; }
  .brand-atmosphere::after { display: none; }
}
    </style>

      <div class="brand-wait" aria-hidden="true"><span class="brand-wait-track"></span><span class="brand-wait-label">Un momento para ti</span></div>
      <div id="startup-recovery" class="startup-recovery" hidden>

        <button id="startup-retry" type="button">Volver a intentar</button>
      </div>
      <noscript>Activa JavaScript para abrir ALIVIA.</noscript>

    <div id="root" inert></div>
    <script>
(() => {
  'use strict';
  const READY_EVENT = 'alivia:screen-ready';
  const MOBILE_INTRO_MS = 2800;
  const DESKTOP_INTRO_MS = 4000;
  const EXIT_MS = 650;
  const RECOVERY_MS = 12000;
  const LANDING_KEY = 'alivia:landing-v1';

  /** Primera visita: manda a la landing y no deja montar la app.
   *
   * Va aqui y no en React a proposito. Este script corre antes de que se
   * cargue el bundle, asi que en la PWA instalada y en la app nativa
   * (Capacitor / iOS) funciona igual que en web: no depende de que React ya
   * haya montado ni de ninguna peticion. Un locate en React dejaria ver el
   * preloader un instante y, si el bundle tardaba, abriria la app sin pasar
   * por la landing.
   *
   * location.replace y no location.assign: replace no deja entrada en el
   * historial, asi que el boton "atras" no devuelve a la landing.
   */
  const gateLanding = () => {
    try {
      if (localStorage.getItem(LANDING_KEY) === '1') return;

      // A los buscadores se les sirve la app directamente: si caen en la
      // landing, Google indexaria la pagina de presentacion en vez del sitio.
      const agent = navigator.userAgent || '';
      if (/bot|crawler|spider|slurp|bingpreview|facebookexternalhit|whatsapp|telegrambot/i.test(agent)) {
        localStorage.setItem(LANDING_KEY, '1');
        return;
      }

      // En nativo el origen es capacitor:// o file://, no un host web. La
      // landing esta dentro del bundle (webDir: dist), asi que la ruta relativa
      // resuelve; aun asi se comprueba que exista el fichero.
      location.replace('/landing.html');
    } catch (err) {
      // Si localStorage esta bloqueado (modo privado, WebView restrictiva) no
      // se puede recordar la visita. Es preferible dejar entrar a la app antes
      // que dejar a nadie atrapado en un bucle de redireccion.
    }
  };

  gateLanding();

  /** Conserva una sola capa desde el HTML hasta que React haya pintado la pantalla. */
  function mountStartup() {
    const overlay = document.getElementById('app-preloader');
    if (!overlay) return;
    overlay.setAttribute('data-startup-mounted', '');
    const device = window.navigator;
    if (device?.connection?.saveData || (device?.hardwareConcurrency && device.hardwareConcurrency <= 4)) {
      overlay.setAttribute('data-lite', '');
    }

    const root = document.getElementById('root');
    const recovery = document.getElementById('startup-recovery');
    const retry = document.getElementById('startup-retry');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const introMs = window.matchMedia('(min-width: 768px) and (pointer: fine)').matches
      ? DESKTOP_INTRO_MS : MOBILE_INTRO_MS;
    const started = performance.now();
    let ready = false;
    let leaving = false;
    let exitTimer;
    let removeTimer;

    const reload = () => window.location.reload();
    const remove = () => {
      clearTimeout(exitTimer);
      clearTimeout(removeTimer);
      clearTimeout(recoveryTimer);
      window.removeEventListener(READY_EVENT, onReady);
      motion.removeEventListener('change', onMotionChange);
      overlay.removeEventListener('transitionend', onTransitionEnd);
      retry?.removeEventListener('click', reload);
      root?.removeAttribute('inert');
      overlay.remove();
    };
    const onTransitionEnd = (event) => {
      if (event.target === overlay && event.propertyName === 'opacity' && leaving) remove();
    };
    const exit = () => {
      if (leaving) return;
      leaving = true;
      clearTimeout(recoveryTimer);
      if (motion.matches) { remove(); return; }
      overlay.classList.add('is-leaving');
      // Respaldo para pestañas en segundo plano, donde transitionend puede no llegar.
      removeTimer = setTimeout(remove, EXIT_MS + 80);
    };
    const scheduleExit = () => {
      clearTimeout(exitTimer);
      const remaining = motion.matches ? 0 : Math.max(0, introMs - (performance.now() - started));
      exitTimer = setTimeout(exit, remaining);
    };
    const onReady = () => {
      if (ready) return;
      ready = true;
      scheduleExit();
    };
    const onMotionChange = () => {
      if (leaving && motion.matches) remove();
      else if (ready) scheduleExit();
    };
    const recoveryTimer = setTimeout(() => {
      if (ready) return;
      overlay.classList.add('has-recovery');
      if (recovery) recovery.hidden = false;
    }, RECOVERY_MS);

    retry?.addEventListener('click', reload);
    overlay.addEventListener('transitionend', onTransitionEnd);
    window.addEventListener(READY_EVENT, onReady);
    motion.addEventListener('change', onMotionChange);
    return remove;
  }

  mountStartup();
})();
    </script>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Bloquear zoom por pellizco y doble toque en toda la app (PWA)
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });
      document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    </script>

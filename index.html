<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-128.png" sizes="128x128" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="ALIVIA" />
    <!-- Viewport bloqueado para PWA: sin zoom por pellizco ni doble toque -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Meta tags SEO y Web App -->
    <title>ALIVIA - Tu Espacio de Calma</title>
    <meta name="description" content="ALIVIA es un espacio seguro y ultra-minimalista para adolescentes y jóvenes. Encuentra calma, realiza ejercicios de respiración, escribe tus pensamientos para dejarlos ir y accede a apoyo inmediato en crisis." />
    <meta name="theme-color" content="#2C533D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Fuentes auto-hospedadas (Lato + Quicksand) vía src/fonts.css: paridad offline en web y app nativa -->

    <!-- Estilo rápido para el Preloader estético de la aplicación -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #1a2a20;
        font-family: 'Lato', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #app-preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        background: radial-gradient(circle at center, #2C533D 0%, #1a2a20 100%);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .preloader-media {
        position: relative;
        width: min(280px, 80vw);
        aspect-ratio: 16 / 9;
        background: #EAEBDD;
        border-radius: 24px;
        overflow: hidden;
      }
      .preloader-media video { width: 100%; height: 100%; display: block; object-fit: contain; }
      .preloader-media img { box-sizing: border-box; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 24px; z-index: 1; }
      @media (prefers-reduced-motion: reduce) {
        .preloader-media video { display: none; }
        #app-preloader { transition: none; }
      }
      .preloader-sub {
        margin-top: 8px;
        font-size: 11px;
        letter-spacing: 0.05em;
        color: #8CB08D;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <!-- Preloader estético que desaparece al inicializarse la App -->
    <div id="app-preloader">
      <div class="preloader-media">
        <img id="preloader-poster" src="/logo-banner.png" alt="ALIVIA" />
        <video id="preloader-video" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
      </div>
      <div class="preloader-sub">cargando espacio seguro...</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Bloquear zoom por pellizco y doble toque en toda la app (PWA)
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });
      document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <script>
      const loadingVideo = document.getElementById('preloader-video');
      const loadingPoster = document.getElementById('preloader-poster');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const updateLoadingMotion = () => {
        loadingPoster.style.visibility = 'visible';
        if (motionPreference.matches) {
          loadingVideo.pause();
          loadingVideo.removeAttribute('src');
          loadingVideo.load();
        } else {
          loadingVideo.src = '%BASE_URL%videos/alivia-reveal.webm';
          loadingVideo.play().catch(() => {});
        }
      };
      loadingVideo.addEventListener('playing', () => {
        loadingPoster.style.visibility = 'hidden';
      });
      loadingVideo.addEventListener('error', () => {
        loadingPoster.style.visibility = 'visible';
      });
      motionPreference.addEventListener('change', updateLoadingMotion);
      updateLoadingMotion();
      // Ocultar preloader cuando la aplicación esté cargada e inicializada
      window.addEventListener('load', function() {
        const preloader = document.getElementById('app-preloader');
        if (preloader) {
          setTimeout(() => {
            preloader.style.opacity = '0';
            setTimeout(() => {
              preloader.style.display = 'none';
              loadingVideo.pause();
              motionPreference.removeEventListener('change', updateLoadingMotion);
            }, 600);
          }, 350);
        }
      });
    </script>
  </body>
</html>

name: Deploy to AWS

on:
  push:
    branches: [main]
  # Republicar sin necesidad de un commit vacio: util tras un release del APK o
  # para revocar un despliegue. El comentario del job validate-infra ya prometia
  # este disparador, pero no estaba declarado.
  workflow_dispatch:
  # Los PR no despliegan: solo validan que la infra compila. Antes no havia
  # ningun trigger de pull_request, asi que un PR no mostraba ningun check de
  # AWS y no habia forma de saber si iba a romper antes de mergearlo.
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  # Valida el SAM en los PRs. No toca AWS: es `sam validate` + `sam build`, que
  # corren en local. Sirve para que un PR que rompe la infraestructura (un YAML
  # mal indentado, un CodeUri mal, una referencia dinamica rota) se vea en el
  # PR y no despues de mergear.
  #
  # El despliegue sigue exclusivamente en el push a main y en dispatch manual.
  validate-infra:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 por lo mismo que en ci.yml: es el runtime de las Lambdas y la
          # version de npm que puede leer el package-lock.json del repo.
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build Lambdas
        # sam build empaqueta ../api/lambda/dist*, asi que tiene que existir.
        run: npm run build:lambda

      - name: Validar templates SAM
        run: |
          for t in app web net database; do
            echo "::group::infra/$t.yaml"
            sam validate --template-file "infra/$t.yaml" --region us-east-1
            echo "::endgroup::"
          done

      - name: Compilar los stacks
        # sam build tambien resuelve los intrinsic. Un YAML invalido por
        # indentacion pasa sam validate y revienta aqui, que es justo el fallo
        # que se lleva por delante un deploy.
        run: |
          for t in app web; do
            echo "::group::build/$t"
            sam build --template-file "infra/$t.yaml" --build-dir ".aws-sam/validate-$t"
            echo "::endgroup::"
          done

  deploy-api:
    # Solo en push a main o dispatch: nunca en un PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: Build Lambda
        run: npm run build:lambda

      # SAM genera los package.json de runtime y ahi se instalan las dependencias
      # nativas. Zippear solo el codigo sin node_modules produce un 502 en Lambda.
      - name: Package API Lambda
        run: |
          cd api/lambda/dist
          npm install --omit=dev --no-audit --no-fund
          zip -qr ../lambda-api.zip .
          cd ../..

      - name: Package TTS Lambda
        run: |
          cd api/lambda/dist-tts
          npm install --omit=dev --no-audit --no-fund
          zip -qr ../lambda-tts.zip .
          cd ../..

      # alivia-ai no tiene dependencias de runtime (usa fetch nativo de Node 22).
      - name: Package AI Lambda
        run: |
          cd api/lambda/dist-ai
          npm install --omit=dev --no-audit --no-fund
          zip -qr ../lambda-ai.zip .
          cd ../..

      - name: Deploy API Lambda
        run: |
          aws lambda update-function-code \
            --function-name alivia-api \
            --zip-file fileb://api/lambda/lambda-api.zip
          aws lambda wait function-updated --function-name alivia-api

      - name: Deploy AI Lambda
        run: |
          aws lambda update-function-code \
            --function-name alivia-ai \
            --zip-file fileb://api/lambda/lambda-ai.zip
          aws lambda wait function-updated --function-name alivia-ai

      - name: Deploy TTS Lambda
        run: |
          aws lambda update-function-code \
            --function-name alivia-tts \
            --zip-file fileb://api/lambda/lambda-tts.zip
          aws lambda wait function-updated --function-name alivia-tts

  deploy-web:
    # Igual que deploy-api: nada de desplegar desde un PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build frontend
        # Vite solo lee VITE_* del entorno en tiempo de build. Las variables de
        # GitHub no llegan solas: hay que declararlas aqui en env:, o el bundle
        # sale sin la clave VAPID publica y el service worker no puede
        # suscribirse a las notificaciones.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TTS_URL: ${{ vars.VITE_TTS_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Deploy to S3
        run: |
          # --exclude "releases/*" no es opcional: el APK se sube a mano con
          # `npm run release:apk` y no vive en dist/. Sin el exclude, cada
          # despliegue de la web lo borraba por el --delete y la pagina de
          # descarga se rompia en silencio (CloudFront respondia el index.html
          # de la SPA con 200 en lugar de un 404).
          aws s3 sync dist/ "s3://${{ secrets.FRONTEND_BUCKET_NAME }}" \
            --delete --exclude "releases/*"
          # Los assets con hash nunca cambian: cache largo e inmutable.
          aws s3 sync dist/assets/ "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/assets" \
            --delete --cache-control "public,max-age=31536000,immutable"
          # index.html y service worker deben recargarse siempre.
          for f in index.html sw.js manifest.webmanifest; do
            if [ -f "dist/$f" ]; then
              aws s3 cp "dist/$f" "s3://${{ secrets.FRONTEND_BUCKET_NAME }}/$f" \
                --cache-control "no-cache,must-revalidate"
            fi
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

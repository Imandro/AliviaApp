name: iOS Project (XcodeGen)

on:
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'Commitea el .xcodeproj y ios/Web al branch actual'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-project
  cancel-in-progress: true

jobs:
  generate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build web assets iOS (ios/Web)
        run: npm run sync:ios

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Alivia.xcodeproj
        run: |
          cd ios
          xcodegen generate

      - name: Commitar proyecto generado
        if: github.event.inputs.force_commit == 'true' || github.event.inputs.force_commit == null
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ios/Alivia.xcodeproj ios/Web
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore(iOS): generar Alivia.xcodeproj y assets web (XcodeGen)"
            git push
          fi

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: alivia-ios-project
          path: |
            ios/Alivia.xcodeproj
            ios/Alivia
            ios/project.yml
          if-no-files-found: error
name: Dispatch push notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-notification-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is missing."
            exit 1
          fi
          curl --silent --show-error --fail-with-body --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://alivia-tu-salud.vercel.app/api/notifications/dispatch"

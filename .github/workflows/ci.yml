name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 y no 24 a proposito: deploy-aws.yml corre en Node 22 (npm 10) y las
          # Lambdas usan el runtime nodejs:22. Con 24 aqui, CI usaria npm 11 y
          # `npm ci` fallaria con "Missing: lightningcss-* from lock file",
          # porque el package-lock.json solo puede satisfacer una de las dos
          # versiones de npm. Todos los workflows que usan npm ci van en 22.
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Tests
        run: npm test

apply plugin: 'com.android.application'

// --- Guardia del despliegue a Azure -----------------------------------------
// La IP publica de la VM aparece en DOS ficheros, y tienen que coincidir:
//
//   src/utils/apiOrigins.ts            -> origen de la API para el shell nativo
//   res/xml/network_security_config.xml -> excepcion de Android al HTTP en claro
//
// Divergen sin que nada lo delate: el JS compila igual y el APK tambien, solo
// que la app no consigue ni registrarse ni llamar a la API. Este check convierte
// ese fallo silencioso en un fallo de build.
//
// Para levantar el bloqueo tras el despliegue:
//   1. `az deployment group show` -> publicIpAddress
//   2. sustituir el placeholder en ambos ficheros
def PLACEHOLDER = 'RELLENAR_CON_LA_IP_PUBLICA_DE_AZURE'

// rootProject es el directorio android/, asi que los recursos del modulo :app
// cuelgan de app/.
def placeholderFiles = [
    rootProject.file('../src/utils/apiOrigins.ts'),
    rootProject.file('app/src/main/res/xml/network_security_config.xml'),
].findAll { it.exists() && it.text.contains(PLACEHOLDER) }

if (placeholderFiles) {
    // El guardia solo aplica al build de release, que es el que se publica. Un
    // assembleDebug para depurar en local no necesita la IP real: el guard se
    // evalua en fase de configuracion, antes de saber que tarea se va a ejecutar,
    // asi que se mira el arranque de Gradle.
    def pedidas = gradle.startParameter.taskNames.join(' ')
    def esRelease = pedidas.contains('Release') || pedidas.contains('release')

    if (esRelease) {
        throw new GradleException(
            "La IP publica de Azure sigue sin rellenar (${PLACEHOLDER}) en:\n" +
            placeholderFiles.collect { "  - " + it.path }.join('\n') + "\n\n" +
            "Es la IP que imprime `az deployment group show --query " +
            "properties.outputs.publicIpAddress.value`. Sin ella el APK se compila " +
            "pero no puede llamar a la API (Android bloquea el trafico en claro) ni " +
            "hacer login. Para un APK de verificacion en local: `assembleDebug`."
        )
    }
    logger.lifecycle("[alivia] IP de Azure sin rellenar; solo se permite en build de debug.")
}

// Firma de release: credenciales en android/keystore.properties (NO subir a git)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.alivia.salud"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.alivia.salud"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file("${rootProject.projectDir}/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
